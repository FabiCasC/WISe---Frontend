    <meta name="theme-color" content="#05060A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#05060A" media="(prefers-color-scheme: light)" />

      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orbita Arcade · Echoes from other worlds" />
    <meta
      property="og:description"
      content="Three real missions, three short games. Learn the science behind Opportunity, Spirit and Apollo 15."
    />
    <!-- Opcional: ver IMAGENES.md §4.1. Si el archivo no existe, no pasa nada. -->
    <meta property="og:image" content="./assets/brand/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Runs before the first paint so the page never flashes the wrong
      // theme. The document ALWAYS ends up with an explicit data-theme,
      // including when the choice is "follow the system": the stylesheet
      // then needs no media query and no duplicated token block.
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('orbita-arcade:theme')
        } catch (e) {
          // Private windows and blocked site data throw. Fall through to
          // the system preference rather than failing to paint.
        }
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Orbita Arcade needs JavaScript turned on to run the games.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
