# Nivel de sanidad de cada PR de Órbita Arcade.
#
#  1. checks  → typecheck, pruebas y build. Calcula una nota de 0 a 100 y la
#               publica como comentario fijo en el PR (se actualiza en cada push).
#               Si algún chequeo falla, el job queda en rojo.
#  2. claude  → Claude revisa el diff con las reglas del proyecto y publica su
#               propia valoración (calidad, contrato, accesibilidad, ciencia).
#
# Requisitos (una sola vez, en Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  o  CLAUDE_CODE_OAUTH_TOKEN
# y la app de Claude instalada en el repo: https://github.com/apps/claude

name: Sanidad del PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-health-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Chequeos y nota
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      score: ${{ steps.health.outputs.score }}
      emoji: ${{ steps.health.outputs.emoji }}
      level: ${{ steps.health.outputs.level }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Tipos
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Pruebas
        id: test
        continue-on-error: true
        run: |
          mkdir -p health
          npx vitest run --reporter=default --reporter=json --outputFile.json=health/vitest.json

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Calcular nivel de sanidad
        id: health
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/pr-health.mjs
          cat health/report.md >> "$GITHUB_STEP_SUMMARY"

      # Los PR desde forks no tienen permiso de escritura: ahí solo queda el resumen del job.
      - name: Publicar comentario fijo en el PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('health/report.md', 'utf8')
            const marker = '<!-- pr-health -->'
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker))
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Bloquear si algún chequeo falló
        if: steps.typecheck.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "::error::Nivel de sanidad ${{ steps.health.outputs.score }}/100. Typecheck=${{ steps.typecheck.outcome }} · Pruebas=${{ steps.test.outcome }} · Build=${{ steps.build.outcome }}"
          exit 1

  claude:
    name: Revisión de Claude
    needs: checks
    # Corre aunque los chequeos fallen (justo ahí más ayuda). No en borradores ni forks.
    if: >-
      always() &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            Nota automática de los chequeos: ${{ needs.checks.outputs.emoji }} ${{ needs.checks.outputs.score }}/100 (${{ needs.checks.outputs.level }}).

            Eres revisor del portal Órbita Arcade (React 18 + TypeScript + Vite + Phaser 3,
            pruebas con Vitest). Es un portal de juegos educativos para escolares de 9 a 14 años
            sobre misiones reales de la NASA (Opportunity, Spirit, Apollo 15). Lee el diff con
            `gh pr diff` y el contexto con `gh pr view`. Revisa SOLO lo que cambia este PR.

            Evalúa de 0 a 10 cada criterio:
            1. Correctitud: bugs, casos borde, estado de React, fugas de timers/listeners de Phaser.
            2. Contrato: cambios en src/shared/types.ts o src/app/GameHost.tsx deben ser
               compatibles hacia atrás (campos nuevos opcionales) y si suben schemaVersion
               deben migrar el progreso de localStorage. Las funciones de progreso deben ser puras.
            3. Pruebas: la lógica nueva (progress.ts, rules.ts de juegos, cliente de API) tiene pruebas.
            4. Accesibilidad: teclado, aria-label, foco visible, prefers-reduced-motion,
               contraste AA (nunca texto Dusk Blue #3E5BA3 sobre Deep Navy #0C0D45),
               usable a 360 px de ancho.
            5. Rigor científico y privacidad: cada dato con sourceId y enlace NASA; nunca afirmar
               "se encontró vida" (decir "pistas de agua antigua"); imágenes con crédito;
               sin nombres, correos ni edad de alumnos.
            6. Textos: toda la UI en español claro para niños, sin errores de ortografía.

            Deja comentarios en línea (mcp__github_inline_comment__create_inline_comment) solo
            para problemas concretos, con la corrección sugerida. Luego publica UN comentario
            general con `gh pr comment` en español con este formato:

            ## 🤖 Revisión de Claude: <emoji> <nota media>/10
            | Criterio | Nota | Comentario breve |
            (una fila por criterio)
            ### Bloqueantes
            (lista, o "Ninguno")
            ### Sugerencias
            (máximo 5)
            **Veredicto:** ✅ Listo para mergear · ⚠️ Mergear tras corregir · ❌ No mergear

            Usa 🟢 si la media es ≥ 8, 🟡 si es 6–7.9 y 🔴 si es < 6. Sé concreto y breve.
